<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Fine Legacy</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #09090b;
            color: #facc15;
            font-family: 'Courier New', Courier, 'Lucida Console', Monaco, monospace;
            font-weight: bold;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #scumm-frame {
            width: 100vw;
            max-width: 1240px;
            height: 100vh;
            max-height: 820px;
            background: #000000;
            border: 3px solid #27272a;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.98);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        #top-bar {
            flex: 0 0 auto;
            min-height: 36px;
            background: #111827;
            border-bottom: 2px solid #27272a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 10px;
            gap: 6px;
            flex-wrap: wrap;
            z-index: 20;
        }

        .game-title {
            color: #facc15;
            font-size: clamp(10px, 1.15vw, 13px);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .top-controls {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-wrap: wrap;
        }

        .scumm-pill {
            background: #1f2937;
            color: #e5e7eb;
            border: 1px solid #4b5563;
            border-radius: 3px;
            font-family: inherit;
            font-weight: bold;
            font-size: clamp(9px, 0.95vw, 11px);
            padding: 3px 7px;
            cursor: pointer;
            transition: all 0.1s ease;
            white-space: nowrap;
        }

        .scumm-pill:hover { border-color: #facc15; color: #facc15; }
        .scumm-pill.active { background: #14532d; border-color: #22c55e; color: #bbf7d0; }
        .scumm-pill.edit-active {
            background: #7f1d1d;
            border-color: #ef4444;
            color: #fecaca;
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.5);
        }

        #viewport-wrap {
            flex: 1 1 65%;
            width: 100%;
            position: relative;
            background: #000000;
            overflow: hidden;
            min-height: 200px;
        }

        canvas#game-canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            cursor: crosshair;
        }

        #crt-scanlines {
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 3px;
            pointer-events: none;
            z-index: 4;
        }

        #editor-toolbar {
            display: none;
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            background: rgba(17, 24, 39, 0.94);
            border: 2px solid #ef4444;
            border-radius: 4px;
            padding: 6px 10px;
            z-index: 15;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 11px;
            color: #f3f4f6;
        }

        .editor-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

        .ed-btn {
            background: #374151;
            color: #f9fafb;
            border: 1px solid #6b7280;
            border-radius: 3px;
            padding: 3px 7px;
            font-family: inherit;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
        }
        .ed-btn:hover { border-color: #facc15; color: #facc15; }
        .ed-btn.danger { background: #7f1d1d; border-color: #ef4444; }
        .ed-btn.primary { background: #15803d; border-color: #22c55e; }

        .ed-input {
            background: #09090b;
            color: #facc15;
            border: 1px solid #4b5563;
            border-radius: 3px;
            padding: 2px 5px;
            font-family: inherit;
            font-size: 10px;
            width: 54px;
        }

        #sentence-bar {
            flex: 0 0 auto;
            min-height: 36px;
            background: #000000;
            border-top: 1px solid #27272a;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px 14px;
            text-align: center;
            z-index: 10;
        }

        #sentence-display {
            color: #facc15;
            font-size: clamp(11px, 1.35vw, 14px);
            line-height: 1.25;
        }

        #control-deck {
            flex: 0 0 23%;
            min-height: 120px;
            max-height: 170px;
            background: #000000;
            display: flex;
            padding: 4px 8px 8px 8px;
            gap: 10px;
            position: relative;
            z-index: 10;
        }

        #verb-grid {
            flex: 0 0 47%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            background: #000000;
            border: 1px solid #27272a;
            border-radius: 4px;
        }

        .verb-btn {
            background: transparent;
            border: none;
            color: #22c55e;
            font-family: inherit;
            font-weight: bold;
            font-size: clamp(12px, 1.55vw, 18px);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .verb-btn:hover { color: #86efac; background: rgba(34, 197, 94, 0.08); }
        .verb-btn.active {
            color: #bbf7d0;
            background: rgba(34, 197, 94, 0.22);
            text-shadow: 0 0 8px rgba(74, 222, 128, 0.75);
        }

        #inventory-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(2, 1fr);
            background: #1f2937;
            border: 2px solid #374151;
            border-radius: 4px;
            gap: 2px;
        }

        .inv-slot {
            background: #111827;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2px;
            overflow: hidden;
        }
        .inv-slot.filled { cursor: pointer; }
        .inv-slot.filled:hover { background: #1e293b; }
        .inv-slot.selected {
            background: #14532d;
            box-shadow: inset 0 0 0 2px #4ade80;
        }
        .inv-slot canvas {
            width: 44px;
            height: 30px;
            image-rendering: pixelated;
        }
        .inv-label {
            font-size: clamp(7px, 0.78vw, 9px);
            color: #9ca3af;
            margin-top: 1px;
            white-space: nowrap;
        }
        .inv-slot.selected .inv-label { color: #bbf7d0; }

        #modal-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.88);
            z-index: 50;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-box {
            background: #111827;
            border: 3px solid #facc15;
            border-radius: 6px;
            max-width: 660px;
            width: 100%;
            max-height: 92%;
            overflow-y: auto;
            padding: 16px 20px;
            color: #f3f4f6;
            text-align: center;
        }
        .modal-box h2 { font-size: 16px; color: #facc15; margin-bottom: 8px; }
        .modal-box p { font-size: 12px; color: #d1d5db; margin-bottom: 10px; line-height: 1.4; }
        .modal-box img { max-width: 100%; border: 2px solid #374151; margin-bottom: 10px; }

        #export-textarea {
            width: 100%;
            height: 220px;
            background: #09090b;
            color: #4ade80;
            border: 1px solid #374151;
            border-radius: 4px;
            padding: 8px;
            font-family: inherit;
            font-size: 11px;
            margin-bottom: 12px;
            resize: vertical;
        }

        .modal-btns { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }

        /* 40th Birthday Card */
        .bday-card {
            background: #fdf6e3;
            color: #3b2f1e;
            border: 6px double #b8860b;
            border-radius: 4px;
            padding: 18px 22px;
            margin-bottom: 12px;
            font-family: Georgia, 'Times New Roman', serif;
            font-weight: normal;
            text-align: left;
        }
        .bday-card .bday-40 {
            font-size: 64px;
            line-height: 1;
            color: #b8860b;
            text-align: center;
            font-weight: bold;
            text-shadow: 2px 2px 0 #f5deb3;
        }
        .bday-card .bday-front {
            text-align: center;
            font-size: 18px;
            margin-bottom: 14px;
            font-style: italic;
        }
        .bday-card p { color: #3b2f1e; font-size: 14px; line-height: 1.55; margin-bottom: 10px; }
        .bday-card .bday-sign { text-align: right; font-style: italic; margin-top: 12px; }
    </style>
</head>
<body>

<div id="scumm-frame">
    <header id="top-bar">
        <div class="game-title">THE FINE LEGACY</div>
        <div class="top-controls">
            <button class="scumm-pill active" data-room="yard">1A: COURTYARD</button>
            <button class="scumm-pill" data-room="studio">1B: STUDIO</button>
            <button class="scumm-pill" id="btn-load-bg">LOAD BG IMAGE</button>
            <button class="scumm-pill" id="btn-load-sprites">LOAD SPRITES</button>
            <button class="scumm-pill" id="btn-debug-physics">[P] PHYSICS BOXES</button>
            <button class="scumm-pill" id="btn-edit-mode">[E] EDIT MODE</button>
            <button class="scumm-pill" id="btn-export-json">EXPORT ROOM JSON</button>
        </div>
    </header>

    <input type="file" id="file-bg-input" accept="image/*" style="display:none;">
    <input type="file" id="file-sprite-input" accept="image/*" style="display:none;">

    <main id="viewport-wrap">
        <canvas id="game-canvas" width="640" height="360"></canvas>
        <div id="crt-scanlines"></div>

        <div id="editor-toolbar">
            <div class="editor-group">
                <span style="color:#f87171;">[EDIT MODE]</span>
                <span>Drag empty space = Draw Collider | Drag box = Move | Drag corner = Resize</span>
            </div>
            <div class="editor-group">
                <label>Selected: <strong id="ed-selected-name" style="color:#facc15;">None</strong></label>
                <label>DepthY: <input type="number" id="ed-depth-y" class="ed-input" step="2"></label>
                <button class="ed-btn danger" id="ed-delete-box">DELETE BOX</button>
                <button class="ed-btn" id="ed-edit-walkbounds">WALK FLOOR Y: <span id="ed-walk-top">245</span></button>
                <button class="ed-btn primary" id="ed-done-btn">DONE</button>
            </div>
        </div>
    </main>

    <section id="sentence-bar">
        <div id="sentence-display">Walk to</div>
    </section>

    <footer id="control-deck">
        <div id="verb-grid">
            <button class="verb-btn" data-verb="Give">Give</button>
            <button class="verb-btn" data-verb="Pick up">Pick up</button>
            <button class="verb-btn" data-verb="Use">Use</button>
            <button class="verb-btn" data-verb="Open">Open</button>
            <button class="verb-btn" data-verb="Look at">Look at</button>
            <button class="verb-btn" data-verb="Push">Push</button>
            <button class="verb-btn" data-verb="Close">Close</button>
            <button class="verb-btn" data-verb="Talk to">Talk to</button>
            <button class="verb-btn" data-verb="Pull">Pull</button>
        </div>
        <div id="inventory-grid"></div>
    </footer>

    <div id="modal-overlay">
        <div class="modal-box" id="modal-content"></div>
    </div>
</div>

<script>
(function() {
    'use strict';

    // =========================================================================
    // 0. ASSET FILES & STORY TEXT (EDIT THESE FREELY)
    // =========================================================================
    // Each asset tries these names in order, inside assets/, with any of the
    // extensions below. The old hash-named files are kept as fallbacks.
    const EXTS = ['.jpg', '.jpeg', '.png', '.webp'];
    const withExts = (base) => EXTS.map(e => base + e);
    const ASSET_FILES = {
        yard:    [...withExts('assets/courtyard'), 'assets/cb11c396.jpeg', 'assets/watermarked_img_15033796555511362109.jpg'],
        studio:  [...withExts('assets/studio'), 'assets/e7ee95ef.jpeg', 'assets/watermarked_img_452717689913521399.jpg'],
        sprites: [...withExts('assets/sprites'), 'assets/b8517d95.jpeg', 'assets/watermarked_img_17393723907537096894.jpg'],
        map:     [...withExts('assets/map')],
        hero:    ['assets/hero.png']
    };

    // Shown when the player opens the 40th Birthday Card.
    const BIRTHDAY_CARD = {
        front: 'Happy 40th Birthday!',
        paragraphs: [
            'Forty years! Where did they all go?',
            'Grandpa David always said that a stone only shows you what is inside it when you are patient enough to really look. He was patient with stone, and he was patient with all of us.',
            'Before he passed, he asked us to give you this card on your fortieth, and to send you back to Ma\'ayan Baruch. He said he left something there for you, something he started carrying from Johannesburg in 1948.',
            'His only hint: "Start in the studio, and look the old mask in the eye."'
        ],
        signature: 'With all our love,\nThe Family'
    };

    // =========================================================================
    // 1. PUZZLE STATE & INVENTORY ITEMS
    // =========================================================================
    const flags = {
        keyTaken: false,        // Studio: key taken from the giant mask's eye
        hoistUnlocked: false,   // Courtyard: hoist control box unlocked with the key
        slabLifted: false,      // Courtyard: hoist lifted the iron slab off the crate
        crateOpened: false,     // Courtyard: 1948 crate opened, ironstone + map found
        ironstonePlaced: false  // Studio: ironstone placed in the basalt figure's hands
    };

    const ITEMS = {
        satchel: {
            label: 'Satchel',
            name: "Grandpa's Satchel",
            icon: 'satchel',
            verbs: {
                'Look at': "Grandpa's battered canvas satchel. It has seen more countries than I have.",
                'Open': 'A pencil stub, a sketchbook full of hands and horses, and a bus ticket to Kiryat Shmona.',
                'Close': "It's already buckled."
            }
        },
        birthdayCard: {
            label: '40th Card',
            name: '40th Birthday Card',
            icon: 'card',
            verbs: {
                'Look at': "A cream card with a big gold '40' on the front. There's writing inside.",
                'Open': () => { showBirthdayCard(); },
                'Close': "It's closed. For now."
            }
        },
        hoistKey: {
            label: 'Iron Key',
            name: 'Iron Key',
            icon: 'key',
            verbs: {
                'Look at': "An old iron key. A paper tag tied to it reads 'HOIST - D.F.'"
            }
        },
        ironstone: {
            label: 'Ironstone',
            name: 'Rough Ironstone',
            icon: 'rock',
            verbs: {
                'Look at': "A rough lump of rust-red ironstone, about the size of a loaf of bread. The note said: 'For the one who holds things up.'"
            }
        },
        oldMap: {
            label: 'Old Map',
            name: 'Old Map',
            icon: 'map',
            verbs: {
                'Look at': "A worn map with a dotted red route: New York and Boston, across to London and Amsterdam, then down to Haifa.",
                'Open': () => { showMap(); }
            }
        }
    };

    // =========================================================================
    // 2. ROOM DATA (EDITABLE & EXPORTABLE)
    // =========================================================================
    // Logical screen resolution is 640 x 360.
    // - walkBounds: walkable floor rectangle.
    // - colliders: solid AABB boxes that block the character's foot box.
    //   depthY: the player draws behind the prop when player.y < depthY.
    //   alwaysDraw: the prop is not in the background art, so it is drawn from
    //   the sprite sheet (or procedurally) on top of the background.
    // - hotspots: interactive objects. verbs: text or functions returning text.
    //   onItem: { itemId: fn } runs for "Use <item> on <hotspot>".
    // - fx: screen positions for puzzle overlays (glints, lights, slab).
    const ROOMS = {
        yard: {
            id: 'yard',
            title: "Ma'ayan Baruch - Studio Courtyard",
            spawn: { x: 332, y: 318, facing: -1 },
            perspective: { minY: 255, maxY: 354, minScale: 0.78, maxScale: 1.08 },
            walkBounds: { minX: 28, maxX: 612, minY: 255, maxY: 352 },
            fx: {
                hoistLight: { x: 166, y: 44 },
                slabChainX: 392,
                slabChainTop: 26
            },
            colliders: [
                { id: 'boulders_left', label: 'Split Basalt Boulders', x: 138, y: 278, w: 112, h: 66, blocksWalk: true, depthY: 336, propType: 'boulders' },
                { id: 'crane_left_leg', label: 'Gantry Crane Caster Left', x: 274, y: 314, w: 32, h: 24, blocksWalk: true, depthY: 334, propType: 'craneLeg' },
                { id: 'crate_1948', label: '1948 Shipping Crate', x: 356, y: 288, w: 118, h: 48, blocksWalk: true, depthY: 332, propType: 'crate', alwaysDraw: true },
                { id: 'stone_bench_right', label: 'Carving Pedestal Right', x: 492, y: 258, w: 98, h: 32, blocksWalk: true, depthY: 286, propType: 'bench' }
            ],
            hotspots: [
                {
                    id: 'hebrewSign',
                    name: 'Sign ("הפסל דוד פיין")',
                    x: 168, y: 180, w: 62, h: 38,
                    walkTo: { x: 215, y: 272 },
                    defaultVerb: 'Look at',
                    verbs: {
                        'Look at': 'The sign reads "הפסל דוד פיין": The Sculptor David Fine. Grandpa came here from South Africa in 1948.',
                        'Pick up': "It's bolted to the fence."
                    }
                },
                {
                    id: 'gantryCrane',
                    name: 'Gantry Crane Hoist',
                    x: 146, y: 0, w: 94, h: 175,
                    walkTo: { x: 262, y: 304 },
                    defaultVerb: 'Use',
                    verbs: {
                        'Look at': () => !flags.hoistUnlocked
                            ? "A rusted A-frame gantry crane with a blue electric chain hoist. The hoist's control box is locked shut."
                            : flags.slabLifted
                                ? 'The hoist hums. The iron slab hangs safely from the hook.'
                                : 'The control box is unlocked and the motor is humming. Ready to lift something heavy.',
                        'Use': () => operateHoist(),
                        'Pull': () => operateHoist(),
                        'Push': () => operateHoist(),
                        'Open': () => flags.hoistUnlocked ? "It's already unlocked." : "The control box is locked. I'd need a key.",
                        'Pick up': 'It weighs about a tonne. I do not.'
                    },
                    onItem: {
                        hoistKey: () => {
                            flags.hoistUnlocked = true;
                            removeItem('hoistKey');
                            return "The iron key turns with a gritty click. The control box swings open and the hoist motor hums to life!";
                        }
                    }
                },
                {
                    id: 'crate1948Spot',
                    name: '1948 Shipping Crate',
                    x: 356, y: 250, w: 118, h: 86,
                    walkTo: { x: 338, y: 316 },
                    defaultVerb: 'Look at',
                    verbs: {
                        'Look at': () => flags.crateOpened
                            ? 'The crate is open. Old straw, and a smell like 1948.'
                            : flags.slabLifted
                                ? 'Stenciled on the timber: "D. FINE - 1948". The slab is off. Only the lid now.'
                                : 'Stenciled on the timber: "D. FINE - 1948". A massive iron slab is lying on the lid.',
                        'Open': () => openCrate(),
                        'Pick up': "It's heavier than I am.",
                        'Push': () => flags.slabLifted ? "It's not going anywhere, and I don't need it to." : "Not with that iron slab on top. It won't budge.",
                        'Close': () => flags.crateOpened ? "I'll leave it open. Whatever was inside is mine now." : "It's already closed."
                    },
                    onItem: {
                        hoistKey: () => "There's no keyhole. The lid isn't locked, it's just pinned under that slab."
                    }
                },
                {
                    id: 'studioDoorSpot',
                    name: 'Studio Door',
                    x: 334, y: 156, w: 96, h: 94,
                    walkTo: { x: 382, y: 268 },
                    defaultVerb: 'Open',
                    verbs: {
                        'Look at': "The green steel door to Grandpa David's sculpture studio.",
                        'Open': () => { loadRoom('studio', { x: 560, y: 302, facing: -1 }); },
                        'Use': () => { loadRoom('studio', { x: 560, y: 302, facing: -1 }); }
                    }
                }
            ],
            exits: [
                {
                    id: 'exit_to_studio',
                    label: 'Enter Studio',
                    x: 352, y: 252, w: 60, h: 10,
                    targetRoom: 'studio',
                    targetSpawn: { x: 560, y: 302, facing: -1 }
                }
            ]
        },

        studio: {
            id: 'studio',
            title: "Ma'ayan Baruch - Sculpture Studio",
            spawn: { x: 540, y: 304, facing: -1 },
            perspective: { minY: 250, maxY: 358, minScale: 0.74, maxScale: 1.08 },
            walkBounds: { minX: 30, maxX: 615, minY: 250, maxY: 358 },
            fx: {
                maskGlint: { x: 64, y: 156 }
            },
            colliders: [
                { id: 'giant_mask_plinth', label: 'Giant Stone Mask & Figures', x: 18, y: 262, w: 156, h: 78, blocksWalk: true, depthY: 338, propType: 'maskPlinth' },
                { id: 'tool_pots', label: 'Tool Pots', x: 18, y: 330, w: 82, h: 28, blocksWalk: true, depthY: 356, propType: 'tools' },
                { id: 'elephant_pedestal', label: 'Elephant Pedestal', x: 150, y: 262, w: 102, h: 36, blocksWalk: true, depthY: 296, propType: 'pedestal' },
                { id: 'mid_sculptures', label: 'Boulder Sculptures', x: 252, y: 252, w: 120, h: 40, blocksWalk: true, depthY: 290, propType: 'boulders' },
                { id: 'center_ox_sculpture', label: 'Bear & Small Figures', x: 204, y: 290, w: 156, h: 48, blocksWalk: true, depthY: 336, propType: 'oxSculpture' },
                { id: 'grey_plinths', label: 'Grey Plinths', x: 372, y: 250, w: 82, h: 16, blocksWalk: true, depthY: 264, propType: 'plinths' },
                { id: 'right_reclining_plinth', label: 'Reclining Figure Plinth', x: 454, y: 250, w: 104, h: 26, blocksWalk: true, depthY: 274, propType: 'recliningPlinth' },
                { id: 'basalt_figure', label: 'Carved Basalt Figure', x: 394, y: 292, w: 48, h: 12, blocksWalk: true, depthY: 300, propType: 'atlas', alwaysDraw: true }
            ],
            hotspots: [
                {
                    id: 'giantMask',
                    name: 'Giant Stone Mask',
                    x: 6, y: 112, w: 92, h: 98,
                    walkTo: { x: 190, y: 330 },
                    defaultVerb: 'Look at',
                    verbs: {
                        'Look at': () => flags.keyTaken
                            ? 'Pale porous limestone with deep, hollow eyes. Nothing glints in there any more.'
                            : 'Pale porous limestone with deep, hollow eyes. Something metal glints inside its left eye!',
                        'Pick up': () => takeKeyFromMask(),
                        'Use': () => takeKeyFromMask(),
                        'Push': 'It weighs more than a car.',
                        'Pull': 'It weighs more than a car.',
                        'Talk to': () => flags.keyTaken ? 'The mask has nothing more to say.' : 'I look it in the eye, like the card said. It looks back... and something glints.'
                    }
                },
                {
                    id: 'basaltFigure',
                    name: 'Carved Basalt Figure',
                    x: 388, y: 196, w: 60, h: 108,

    function processChromaKeySpriteSheet(img) {
        try {
            const w = img.naturalWidth || img.width;
            const h = img.naturalHeight || img.height;
            if (!w || !h) return;
            const off = document.createElement('canvas');
            off.width = w;
            off.height = h;
            const octx = off.getContext('2d');
            octx.drawImage(img, 0, 0);
            const imgData = octx.getImageData(0, 0, w, h);
            const data = imgData.data;
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i], g = data[i + 1], b = data[i + 2];
                if ((r > 170 && b > 170 && g < 115) || (r > 145 && b > 145 && g < Math.min(r, b) * 0.58)) {
                    data[i + 3] = 0;
                }
            }
            octx.putImageData(imgData, 0, 0);
            spriteSheet.canvas = off;
            spriteSheet.ready = true;
            renderInventory();
        } catch (e) {
            spriteSheet.ready = false;
        }
    }

    function loadFirstImage(sources, onLoad) {
        const tryIdx = (idx) => {
            if (idx >= sources.length) return;
            const img = new Image();
            img.onload = () => onLoad(img, sources[idx]);
            img.onerror = () => tryIdx(idx + 1);
            img.src = sources[idx];
        };
        tryIdx(0);
    }

    // Draws a sprite-sheet region into a destination rect. Returns false if not ready.
    function drawSpriteRegion(targetCtx, key, dx, dy, dw, dh, srcTopFrac = 0) {
        if (!spriteSheet.ready) return false;
        const reg = spriteSheet.regions[key];
        const sc = spriteSheet.canvas;
        if (!reg || !sc) return false;
        const sy = reg.y + reg.h * srcTopFrac;
        const sh = reg.h * (1 - srcTopFrac);
        targetCtx.drawImage(
            sc,
            Math.floor(reg.x * sc.width), Math.floor(sy * sc.height),
            Math.floor(reg.w * sc.width), Math.floor(sh * sc.height),
            dx, dy, dw, dh
        );
        return true;
    }
